services:
  vrising_server:
    image: azureowl/vrising-dedicated-server:latest
    container_name: vrising
    ports:
      - 27015:27015/udp
      - 27016:27016/udp
    volumes:
      - /path/to/game/files:/vrising
      - /path/to/config/files:/serverData
    stop_grace_period: 2m
    # Optional overrides for ServerHostSettings.json, see readme for the full list
    # environment:
      # - VR_NAME=My V Rising Server
      # - VR_DESCRIPTION=Role playing server. Be nice.
      # - VR_MAX_USERS=40
      # - VR_PASSWORD=SuperSecret
      # - VR_PRESET=StandardPvP
      # - VR_DIFFICULTY_PRESET=Difficulty_Normal
    restart: unless-stopped
